name: CI

# Visto rosso il 25/09/2026: togliendo il bit di esecuzione a guard-tempo.py il passo
# «Bit di esecuzione» ha fallito con «non eseguibile: plugins/cantiere/hooks/guard-tempo.py»
# e la PR e' passata a BLOCKED.
#   https://github.com/OwnConsent/cantiere/actions/runs/36118902061
#
# Visto rosso il 01/10/2026: tolto qa-test da template/githooks/ruoli, il passo
# «L'elenco dei ruoli del git hook coincide con agents/» ha fallito con
# «in agents/ ma non in template/githooks/ruoli: qa-test».
#   https://github.com/OwnConsent/cantiere/actions/runs/36882500211
#
# Visto rosso il 04/10/2026, su ubuntu-26.04: rimesso su una copia il finto git di
# verifica-gate.sh come link «dormi» a sleep, la suite ha fatto «3 fallite su 491»:
# i due casi «journal-check: git non finisce» e «secondo giro» e «guard-tempo: git
# non finisce», tutti con «ottenuto passa-muto».
#   https://github.com/OwnConsent/cantiere/actions/runs/37211720540
# Un gate mai visto rosso e' una decorazione.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # Immagine fissata. Dal 19/10/2026 l'etichetta mobile passa a Ubuntu 26.04, a
    # scaglioni fino al 19/11: nel frattempo lo stesso job gira su una o sull'altra.
    #   https://github.com/actions/runner-images/issues/14748
    # Si e' passati a 26.04 con una prova, non per il calendario di GitHub: il 04/10/2026
    # (PR 21) su 26.04 i gate negano come su 24.04. Fallivano solo i tre casi «git non
    # finisce», perche' il finto git della suite era un link «dormi» a sleep e lo sleep
    # di uutils non parte sotto un nome non suo; con un finto git che e' uno script la
    # suite fa 491 su 491 su entrambe le immagini.
    runs-on: ubuntu-26.04
    steps:
      # Action fissate al commit, con il tag in commento: un tag si puo' spostare.
      # Entrambe girano su node24 (SHA riletti con gh api il 04/10/2026).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nessun runs-on su un'etichetta mobile
        run: |
          # Un runs-on: ubuntu-latest rimesso per abitudine non fallisce subito:
          # cambia immagine un giorno qualunque, e il rosso arriva su una PR che
          # non c'entra. Si cerca la chiave, non la parola: commenti e questo passo
          # non contano. Non vede un'etichetta passata da una matrix.
          trovati=$(grep -nE '^[[:space:]]*runs-on:.*ubuntu-latest' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || true)
          if [ -n "$trovati" ]; then
            echo "runs-on su ubuntu-latest:"; echo "$trovati"
            echo "ubuntu-latest cambia immagine quando lo decide GitHub (actions/runner-images#14748:"
            echo "a 26.04 dal 19/10/2026, a scaglioni), e un'immagine nuova si adotta con una PR che"
            echo "la prova. Scrivi l'immagine: ubuntu-26.04."
            exit 1
          fi
          echo "nessun runs-on su ubuntu-latest"

      - name: Sintassi
        run: |
          python3 -m py_compile plugins/cantiere/hooks/*.py
          for f in plugins/cantiere/hooks/*.sh template/githooks/*; do
            [ -f "$f" ] && bash -n "$f"
          done

      - name: Bit di esecuzione
        run: |
          # Un hook senza bit x non fallisce: TACE. E un gate che tace e' peggio
          # di un gate assente, perche' nessuno se ne accorge.
          mancanti=0
          for f in plugins/cantiere/hooks/*.py plugins/cantiere/hooks/*.sh; do
            if [ ! -x "$f" ]; then echo "non eseguibile: $f"; mancanti=1; fi
          done
          exit $mancanti

      - name: hooks.json punta a file che esistono
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          conf = json.load(open("plugins/cantiere/hooks/hooks.json"))
          mancanti = []
          for evento, gruppi in conf["hooks"].items():
              for gruppo in gruppi:
                  for h in gruppo.get("hooks", []):
                      # dal 03/10 il comando e' un involucro di shell attorno allo script:
                      # "${CLAUDE_PLUGIN_ROOT}/hooks/x.sh" || { ... }. Lo script e' il
                      # percorso fra virgolette; un comando senza, non lo si sa verificare.
                      trovati = re.findall(r'"\$\{CLAUDE_PLUGIN_ROOT\}/([^"]+)"', h["command"])
                      if not trovati:
                          mancanti.append(f"{evento}: nessuno script riconosciuto in: {h['command'][:60]}")
                      for t in trovati:
                          p = os.path.join("plugins/cantiere", t)
                          if not os.path.isfile(p):
                              mancanti.append(f"{evento}: {p}")
          if mancanti:
              print("hook registrati ma inesistenti:", *mancanti, sep="\n  ")
              sys.exit(1)
          print("tutti gli hook registrati esistono")
          PY

      - name: L'elenco dei ruoli del git hook coincide con agents/
        run: |
          # template/githooks/ruoli e' una copia: il git hook vive nel repository di
          # progetto e non vede il plugin. Se un ruolo nasce o sparisce in agents/ e
          # la copia resta indietro, il git hook nega i commit di un ruolo vero, o ne
          # accetta uno che non esiste piu'.
          python3 - <<'PY'
          import os, sys
          agenti = {f[:-3] for f in os.listdir("plugins/cantiere/agents") if f.endswith(".md")}
          righe = [r.strip() for r in open("template/githooks/ruoli")]
          ruoli = [r for r in righe if r and not r.startswith("#")]
          doppi = sorted({r for r in ruoli if ruoli.count(r) > 1})
          solo_agenti, solo_ruoli = sorted(agenti - set(ruoli)), sorted(set(ruoli) - agenti)
          if solo_agenti or solo_ruoli or doppi:
              if solo_agenti: print("in agents/ ma non in template/githooks/ruoli:", *solo_agenti)
              if solo_ruoli:  print("in template/githooks/ruoli ma non in agents/:", *solo_ruoli)
              if doppi:       print("ripetuti in template/githooks/ruoli:", *doppi)
              sys.exit(1)
          print(f"{len(ruoli)} ruoli, gli stessi di agents/")
          PY

      - name: verifica-gate
        run: |
          python3 --version
          # La suite va eseguita DA un progetto, non dal repo del plugin, e quel
          # progetto non puo' stare sotto un prefisso di sistema: sotto /tmp il
          # perimetro non esiste e meta' delle verifiche passerebbe per il motivo
          # sbagliato. $RUNNER_TEMP sta sotto /home/runner, quindi va bene.
          P="$RUNNER_TEMP/progetto-prova"
          mkdir -p "$P" && cd "$P"
          git init -q -b main
          git config user.email ci@cantiere.invalid
          git config user.name ci
          # senza .cantiere-deny il livello 2 non viene verificato affatto: la suite
          # lo dichiara e va avanti. In CI lo vogliamo verificato.
          printf 'OwnConsent/cmp\n' > .cantiere-deny
          echo segnaposto > CLAUDE.md
          git add -A && git commit -qm base
          CLAUDE_PROJECT_DIR="$P" bash "$GITHUB_WORKSPACE/plugins/cantiere/hooks/verifica-gate.sh"

      # Il README del plugin dichiara Python 3.10 come minimo. Il runner ha un Python piu'
      # recente (3.14 su ubuntu-26.04), che non vede l'uso di una funzione nata dopo:
      # os.waitstatus_to_exitcode (3.9) e' arrivata cosi' fino alla review della PR 19,
      # quando il minimo era 3.8, e li' avrebbe fatto negare ogni azione a ogni gate Python.
      # Il minimo e' 3.10 dal 04/10/2026: 3.8 e' fuori supporto e actions/python-versions
      # non ne ha una build per 26.04; 3.10 e' la piu' vecchia che c'e' su 24.04 e su 26.04.
      - name: Python minimo dichiarato
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: verifica-gate con il Python minimo
        run: |
          python3 --version
          python3 --version | grep -q '^Python 3\.10\.' || { echo "python3 non e' il 3.10 dichiarato"; exit 1; }
          grep -q 'Python 3\.10 o successivo' plugins/cantiere/README.md || { echo "il README non dichiara piu' Python 3.10: allinea questo passo"; exit 1; }
          P="$RUNNER_TEMP/progetto-prova-minimo"
          mkdir -p "$P" && cd "$P"
          git init -q -b main
          git config user.email ci@cantiere.invalid
          git config user.name ci
          printf 'OwnConsent/cmp\n' > .cantiere-deny
          echo segnaposto > CLAUDE.md
          git add -A && git commit -qm base
          CLAUDE_PROJECT_DIR="$P" bash "$GITHUB_WORKSPACE/plugins/cantiere/hooks/verifica-gate.sh"

      - name: Nessun bytecode committato
        run: |
          # Il 24/09 un .pyc di guard-tempo e' finito in un commit: gli hook girano
          # come script, ma py_compile lascia __pycache__ e il repo non lo ignorava.
          trovati=$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)
          if [ -n "$trovati" ]; then
            echo "bytecode tracciato nel repo:"; echo "$trovati"; exit 1
          fi
          echo "nessun bytecode tracciato"
